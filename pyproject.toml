[project]
name = "discord-ticket-renamer"
version = "2.4.0"
description = "Discord bot pro prejmenovani a vyplneni osobnich slozek podle propojene zadosti."
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.6,<3",
    "aiohttp>=3.9,<4",
    "python-dotenv>=1.0,<2",
    "pystray>=0.19.5,<1",
    "Pillow>=10,<13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
